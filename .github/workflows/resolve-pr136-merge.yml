name: Resolve PR 136 merge conflict

on:
  push:
    branches:
      - docs/cspell-scope-policy

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/cspell-scope-policy
          fetch-depth: 0

      - name: Merge current main and resolve known conflicts
        shell: bash
        run: |
          set -euo pipefail
          article='content/post/2026/043-canonical-github-actions-ci-cd-super-reference/index.md'

          # Preserve the article-local directive from the PR branch before merging.
          directive="$(git show HEAD:"$article" | grep -m1 '^<!-- cspell:words ' || true)"
          if [[ -z "$directive" ]]; then
            echo 'Expected article-local cspell directive was not found before merge.' >&2
            exit 1
          fi

          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts: %s\n' "${conflicts[*]}"

            expected_one='.cspell.json'
            expected_two="$article"
            for path in "${conflicts[@]}"; do
              if [[ "$path" != "$expected_one" && "$path" != "$expected_two" ]]; then
                echo "Unexpected merge conflict: $path" >&2
                git merge --abort
                exit 1
              fi
            done

            # Keep the fully-scoped dictionary from this PR. New main-side words
            # will be caught by the real spell check and scoped locally if needed.
            git checkout --ours .cspell.json
            git add .cspell.json

            # Keep the newer canonical-CI article from main, then restore this
            # PR's article-local spelling directive immediately after front matter.
            git checkout --theirs "$article"
            ARTICLE="$article" DIRECTIVE="$directive" python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['ARTICLE'])
          directive = os.environ['DIRECTIVE']
          text = path.read_text()
          lines = text.splitlines(keepends=True)
          if not lines or lines[0].strip() != '---':
              raise SystemExit('article does not start with YAML front matter')
          closing = next((i for i in range(1, len(lines)) if lines[i].strip() == '---'), None)
          if closing is None:
              raise SystemExit('article front matter has no closing delimiter')
          insert_at = closing + 1
          while insert_at < len(lines) and lines[insert_at].strip() == '':
              del lines[insert_at]
          lines[insert_at:insert_at] = ['\n', directive + '\n', '\n']
          path.write_text(''.join(lines))
          PY
            git add "$article"
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved conflicts remain.' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Merge main into cspell scope policy'
          git push origin HEAD:docs/cspell-scope-policy
