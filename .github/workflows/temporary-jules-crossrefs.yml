name: One-time Jules management cross-references

on:
  push:
    branches:
      - docs/jules-management-cross-references-20260924

permissions:
  contents: write

jobs:
  inline:
    if: github.repository == 'arran4/blog'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/jules-management-cross-references-20260924
          persist-credentials: true
      - name: Inline related posts into existing Jules management article
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = 'arran4/blog'
          test "${GITHUB_REF_NAME}" = 'docs/jules-management-cross-references-20260924'
          python3 - <<'PY'
          from pathlib import Path
          directory = Path('content/post/2026/044-jules-management')
          original = directory / 'index.md'
          appendix = directory / 'management-crossrefs-temp.md'
          before = original.read_text(encoding='utf-8')
          addition = appendix.read_text(encoding='utf-8').strip()
          anchor = '\n## Why I use Jules first\n'
          heading = '### Related implementation and testing references'
          assert before.count(anchor) == 1, 'Missing or ambiguous insertion anchor'
          assert heading not in before, 'References already present'
          assert addition.startswith(heading), 'Unexpected appendix'
          updated = before.replace(anchor, '\n' + addition + '\n' + anchor, 1)
          assert updated.count(addition) == 1
          assert updated.replace('\n' + addition + '\n', '', 1) == before
          original.write_text(updated, encoding='utf-8')
          print('Added cross-references directly to existing article.')
          PY
          git rm -- content/post/2026/044-jules-management/management-crossrefs-temp.md .github/workflows/temporary-jules-crossrefs.yml
          git add -- content/post/2026/044-jules-management/index.md
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: link practical testing and handoff posts in Jules management'
          git push origin HEAD:docs/jules-management-cross-references-20260924
