name: GitHub Pages

on:
  push:
    branches:
      - main  # Set a branch name to trigger deployment
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Test discussion reconciliation
        run: python3 -m unittest discover -s .github/scripts -p 'test_sync_post_discussions.py'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.119.0'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        if: ${{ github.ref == 'refs/heads/main' }}


  backfill-discussions-for-this-pr:
    # One-time migration: restricted to this same-repository PR branch.
    # Remove this job once its results have been committed to the PR.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/explicit-post-discussions'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    concurrency:
      group: backfill-blog-discussions-pr215
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/explicit-post-discussions
          persist-credentials: true
      - name: Audit existing discussion matches before reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import sys
          sys.path.insert(0, ".github/scripts")
          import sync_post_discussions as sync
          _repo, discussions = sync.discussions()
          for post in sync.posts():
              candidates = [d for d in discussions if post["key"] in sync.paths(d)]
              if len(candidates) > 1:
                  print("AMBIGUOUS", post["path"], json.dumps([
                      {"id": d["id"], "url": d["url"], "title": d["title"],
                       "body": (d.get("body") or "")[:250]} for d in candidates
                  ]), flush=True)
          print("Inspected", len(discussions), "existing discussions", flush=True)
          PY
      - name: Reuse existing discussions, create missing ones and record actual links
        if: false # Temporarily disabled for read-only ambiguity audit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/sync_post_discussions.py --apply
      - name: Commit backfilled front matter into this PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'content/post'
          if git diff --cached --quiet; then
            echo "All posts already have discussion URLs."
            exit 0
          fi
          git commit -m "chore: record verified discussions for published posts"
          git push origin HEAD:feature/explicit-post-discussions
