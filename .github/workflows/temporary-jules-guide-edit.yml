name: Temporary in-place Jules guide edit
on:
  push:
    branches:
      - docs/jules-pr-submission-guidance-20260919
    paths:
      - .github/workflows/temporary-jules-guide-edit.yml
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/jules-pr-submission-guidance-20260919
          persist-credentials: true
      - name: Update existing guide, verify and commit to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('content/post/2026/044-jules-management/index.md')
          text = path.read_text(encoding='utf-8')
          original = text
          def replace_once(old, new):
              global text
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'Expected one occurrence, found {n}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          replace_once(
              'When those signals are absent, the management layer should not send `@jules` instructions or treat the branch as Jules-owned unless some other concrete evidence establishes that Jules is the active implementation agent. A management-owned PR should be edited directly when the requested change is within the management layer\'s capabilities.\n',
              'When those signals are absent, the management layer should not send `@jules` instructions or treat the branch as Jules-owned unless some other concrete evidence establishes that Jules is the active implementation agent. A management-owned PR should be edited directly when the requested change is within the management layer\'s capabilities.\n\n**A mention is not participation.** A human or management LLM posting `@jules` in a comment does not make a PR Jules-managed. Inspect the PR author, description, task/session link, and whether the Jules bot actually responded or published work. In particular, a PR created by the management LLM with no Jules task/session link and no Jules bot involvement is management-owned even if its subject is Jules or someone has addressed a comment to `@jules`. Do not delegate such a PR back to Jules by habit. The management LLM should commit the requested change directly to its existing branch when it has write access and the human has authorised the edit.\n\nThe converse also matters: a bot comment or task link is evidence to investigate, not a substitute for checking actual branch ownership and the active implementation agent. Where provenance is ambiguous, inspect the linked session and branch history before routing corrective work.\n'
          )
          replace_once(
              'Visibility is much better when Jules publishes a pull request and intermediate state early rather than doing a large amount of work invisibly and only exposing it at the end.\n',
              'Visibility is much better when Jules publishes a pull request and intermediate state early rather than doing a large amount of work invisibly and only exposing it at the end.\n\n### Submission is a required outcome\n\nEvery Jules task must end with an **inspectable pull request submitted for management review**. Give the implementation agent one positive, unambiguous instruction: complete the scoped work, commit and push the deliverable, and submit or update the PR. A local report, uncommitted files, a local commit, or a pushed branch without a submitted PR is not a completed submission. The same requirement applies to implementation, audits, documentation, verification, test hardening, and issue reconciliation. If an audit finds no production-code defect, checked-in evidence or a focused documentation update can still be its reviewable deliverable; do not invent unrelated code changes.\n\nThe management prompt should state the required end state rather than adding conditional alternatives such as "no PR is necessary if no code changes are warranted" or "report the findings instead of submitting a PR". Those alternatives can cause the agent to stop with work that management cannot review. If the task already has a PR, update and push that PR; otherwise submit the task PR. A genuine submission failure must be described with the exact error, branch, commit, and remaining action so management can complete authorised administration. This exception is for an observed capability failure, not a default alternative ending in the task prompt.\n\nFor example, the submission instruction can be: **"Complete the scoped work, record the evidence and remaining limitations, commit and push the deliverable, submit the pull request for management review, and return its URL and exact head commit."** Submission does not imply technical approval, a ready-for-review transition, issue closure, or a merge. Those remain separate management and human decisions described below.\n'
          )
          replace_once(
              'If Jules asks an out-of-band question indicating that there are no code changes left to make, but it cannot perform the remaining GitHub administration (such as updating pull-request metadata, resolving issues, or closing a PR), the management LLM should normally treat that as a **successful implementation handoff**.\n\nThe appropriate answer is effectively, "Yes, stop here and hand the remaining management actions back to the management layer." Do not send Jules back to retry an operation it has just established it cannot perform.\n',
              'If Jules has submitted its PR and asks an out-of-band question indicating that no implementation changes remain, but it cannot perform the remaining GitHub administration (such as updating pull-request metadata, resolving issues, or closing a PR), the management LLM should normally treat that as a **successful implementation handoff**.\n\nThe appropriate answer is effectively, "The work is submitted; hand the remaining management actions back to the management layer." Do not send Jules back to retry an operation it has just established it cannot perform. If the PR itself has not been submitted because of a demonstrated capability failure, management must ensure the work becomes a submitted, inspectable PR before treating the task as handed off.\n'
          )
          if original == text:
              raise RuntimeError('Article was not modified')
          path.write_text(text, encoding='utf-8')
          Path('content/post/2026/jules-pr-submission-rule/index.md').unlink()
          Path('.github/workflows/temporary-jules-guide-edit.yml').unlink()
          PY
          git diff --check
          npx --yes cspell@8.19.4 lint content/post/2026/044-jules-management/index.md --config .cspell.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/post/2026/044-jules-management/index.md content/post/2026/jules-pr-submission-rule/index.md .github/workflows/temporary-jules-guide-edit.yml
          git diff --cached --check
          git commit -m 'docs: integrate submission and PR ownership guidance into existing Jules guide'
          git push origin HEAD:refs/heads/docs/jules-pr-submission-guidance-20260919