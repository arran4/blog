name: Check Missing _index.md

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-index-md:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for missing _index.md files
        run: |
          has_error=0
          while IFS= read -r -d '' dir; do
            if [ ! -f "$dir/_index.md" ]; then
              echo "Error: Missing _index.md in $dir"
              has_error=1
            fi
          done < <(find content/post -mindepth 1 -maxdepth 1 -type d -print0)

          if [ $has_error -eq 1 ]; then
            echo "Hugo requires _index.md files in nested directories to render listings properly."
            exit 1
          fi
          echo "All post directories contain _index.md."
