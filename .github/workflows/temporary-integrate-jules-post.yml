name: Temporary integration of Jules post-merge guidance
on:
  push:
    branches:
      - docs/jules-post-merge-repo-first-followups
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate amendment in the existing post and remove temporary files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          original = Path('content/post/2026/044-jules-management/index.md')
          companion = Path('content/post/2026/045-jules-management-post-merge-followups/index.md')
          helper = Path('.github/workflows/temporary-integrate-jules-post.yml')
          text = original.read_text()
          new = companion.read_text()
          start = '## Start with the repository that just merged\n'
          end = '### A short example\n'
          anchor = '## A compact bootstrap contract for a fresh management LLM\n'
          later = '## Let the workflow teach the workflow\n'
          assert text.count(anchor) == 1
          assert text.count(later) == 1
          assert text.count('\n35. ') == 1
          assert new.count(start) == 1 and new.count(end) == 1
          section = new.split(start, 1)[1].split(end, 1)[0].rstrip()
          section = ('### Start with the repository that just merged\n' + section)
          for heading in ('Look for work that the merge actually unblocks', 'Turn newly unblocked tasks into separate, reviewable PRs', 'Required post-merge answer order'):
              section = section.replace('## ' + heading + '\n', '### ' + heading + '\n')
          text = text.replace(anchor, '## Repository-first continuation and dependency-unblocked work\n\n' + section + '\n\n' + anchor)
          bootstrap = ('36. After a confirmed merge, give the **first full Jules prompt for the repository just merged**. '
                       'Inspect its open issues and PRs before recommending work elsewhere. In addition, check whether the merge unblocks '
                       'work in this or other repositories; verify any required released version and consumer pin before presenting a '
                       'separate executable prompt or creating an authorised draft PR in the target repository. '
                       'If a dependency is merged but unreleased, mark dependent work as waiting; do not let an existing upstream issue '
                       'replace the original repository\'s primary prompt.\n\n')
          text = text.replace(later, bootstrap + later)
          original.write_text(text)
          companion.unlink()
          helper.unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- content/post/2026/044-jules-management/index.md content/post/2026/045-jules-management-post-merge-followups/index.md .github/workflows/temporary-integrate-jules-post.yml
          git diff --cached --check
          git diff --cached --name-status
          git commit -m 'docs: fold repository-first followups into Jules management article'
          git push origin HEAD:docs/jules-post-merge-repo-first-followups
