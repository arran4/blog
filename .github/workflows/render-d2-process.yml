name: Render D2 process diagrams

on:
  pull_request:
    paths:
      - 'content/post/2026/059-ai-assisted-repository-process/workflow.d2'
      - 'content/post/2026/059-ai-assisted-repository-process/render-diagrams.sh'
      - '.github/workflows/render-d2-process.yml'

permissions:
  contents: write

jobs:
  render:
    # Only push back to a branch in this repository, never a fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Install pinned D2 CLI
        run: |
          archive="$(mktemp)"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/d2lang/d2/releases/download/v0.9.0/d2-v0.9.0-linux-amd64.tar.gz" \
            --output "$archive"
          echo "5669ddc46b99e942cc96078f4a4e36d5e62103348f4c05179ede27802fdd87a9  $archive" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzOf "$archive" d2-v0.9.0/bin/d2 > "$HOME/.local/bin/d2"
          chmod +x "$HOME/.local/bin/d2"
          rm -f "$archive"
          "$HOME/.local/bin/d2" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install SVG rasteriser for PNG export
        run: |
          if ! command -v rsvg-convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends librsvg2-bin
          fi
      - name: Render diagrams from source
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash content/post/2026/059-ai-assisted-repository-process/render-diagrams.sh
      - name: Commit generated diagram exports
        run: |
          git add -- 'content/post/2026/059-ai-assisted-repository-process/workflow.svg' 'content/post/2026/059-ai-assisted-repository-process/workflow.png'
          if git diff --cached --quiet; then
            echo 'Generated diagrams are unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c commit.gpgsign=false commit -m 'docs: render SVG and PNG process diagrams'
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
